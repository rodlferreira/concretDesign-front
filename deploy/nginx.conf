# Incluir no server HTTPS do domínio real, configurando certificados TLS.
# root /caminho/para/concretDesign/dist;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
client_max_body_size 12k;
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # No backend: TRUSTED_PROXY_IPS=127.0.0.1,::1,::ffff:127.0.0.1
    # O proxy substitui o header; nunca preserva um X-Forwarded-For do cliente.
}
location / { try_files $uri $uri/ /index.html; }
location ~ /\. { deny all; }
